<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — AQUENZA Management Portal</title>
  <link rel="icon" type="image/svg+xml" href="/assets/clean/aquenza_logo_horizontal.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/components.css">
  <style>
    body {
      background: var(--bg-secondary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .login-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: clamp(1.25rem, 5vw, 2.5rem);
      width: 100%;
      max-width: 440px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
      position: relative;
    }
    @media (max-width: 480px) {
      body { padding: 0.75rem; }
      .login-header { margin-bottom: 1.5rem; }
      .login-logo { height: 38px; }
      .login-title { font-size: 1.25rem; }
    }
    .login-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .login-logo {
      height: 48px;
      margin: 0 auto 1.25rem;
      display: block;
    }
    .login-title {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--text-primary);
      margin-bottom: 0.35rem;
    }
    .login-subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .form-group {
      margin-bottom: 1.25rem;
    }
    .form-label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 0.45rem;
    }
    .form-input {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid var(--input-border);
      border-radius: 8px;
      background: var(--input-bg);
      color: var(--input-text);
      font-size: 0.92rem;
      font-family: inherit;
      transition: border-color 0.2s;
    }
    .form-input:focus {
      outline: none;
      border-color: #0052CC;
      box-shadow: 0 0 0 3px rgba(0, 82, 204, 0.15);
    }
    .login-btn {
      width: 100%;
      padding: 0.85rem;
      border: none;
      border-radius: 8px;
      background: #0052CC;
      color: #FFFFFF;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s;
    }
    .login-btn:hover { background: #0040A8; }
    .login-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .alert-box {
      padding: 0.85rem;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 1.25rem;
      display: none;
    }
    .alert-error {
      background: #FEF2F2;
      border: 1px solid #FECACA;
      color: #991B1B;
    }
    [data-theme="dark"] .alert-error {
      background: #450A0A;
      border-color: #7F1D1D;
      color: #FCA5A5;
    }
    .theme-top-toggle {
      position: absolute;
      top: 1rem;
      left: 1rem;
    }
  </style>
</head>
<body>

  <div class="theme-top-toggle">
    <button id="themeToggleBtn" class="theme-toggle-btn" aria-label="Toggle theme">
      <svg class="theme-icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
      <svg class="theme-icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
    </button>
  </div>

  <div class="login-card">
    <div class="login-header">
      <img src="/assets/clean/aquenza_logo_horizontal.svg" alt="AQUENZA" class="login-logo logo-light">
      <img src="/assets/clean/aquenza_logo_horizontal_dark.svg" alt="AQUENZA" class="login-logo logo-dark">
      <h1 class="login-title">Admin Management Portal</h1>
      <p class="login-subtitle">Secure administrative gateway for AQUENZA operations</p>
    </div>

    <div id="loginAlert" class="alert-box alert-error"></div>

    <form id="adminLoginForm">
      <div class="form-group">
        <label for="adminEmail" class="form-label">Administrator Email</label>
        <input type="email" id="adminEmail" class="form-input" required autofocus placeholder="admin@aquenza.in" autocomplete="username">
      </div>

      <div class="form-group">
        <label for="adminPassword" class="form-label">Password</label>
        <div style="position: relative;">
          <input type="password" id="adminPassword" class="form-input" required placeholder="••••••••••••" autocomplete="current-password" style="padding-right: 2.75rem;">
          <button type="button" id="togglePasswordBtn" style="position: absolute; right: 0.75rem; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--text-muted); padding: 4px;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          </button>
        </div>
      </div>

      <button type="submit" id="submitBtn" class="login-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
        Sign In to Dashboard
      </button>
    </form>

    <div style="margin-top: 1.75rem; text-align: center;">
      <a href="/" style="font-size: 0.84rem; color: #0052CC; text-decoration: none; font-weight: 600;">← Return to Public Website</a>
    </div>
  </div>

  <script src="/js/theme.js"></script>
  <script>
    // Password toggle
    const pwdInput = document.getElementById('adminPassword');
    const toggleBtn = document.getElementById('togglePasswordBtn');
    toggleBtn.addEventListener('click', () => {
      const isPwd = pwdInput.type === 'password';
      pwdInput.type = isPwd ? 'text' : 'password';
    });

    // Check if already authenticated
    fetch('/api/admin/session')
      .then(res => res.json())
      .then(data => {
        if (data.authenticated) {
          window.location.href = '/admin/dashboard';
        }
      })
      .catch(() => {});

    // Handle form submit
    const form = document.getElementById('adminLoginForm');
    const alertBox = document.getElementById('loginAlert');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Authenticating...';

      const email = document.getElementById('adminEmail').value.trim();
      const password = document.getElementById('adminPassword').value;

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (data.success) {
          window.location.href = '/admin/dashboard';
        } else {
          alertBox.textContent = data.message || 'Login failed. Please check your credentials.';
          alertBox.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg> Sign In to Dashboard';
        }
      } catch (err) {
        alertBox.textContent = 'Connection error: ' + err.message;
        alertBox.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In to Dashboard';
      }
    });
  </script>
</body>
</html>
