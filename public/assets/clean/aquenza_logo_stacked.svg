    <path d="M 6 68 C 24 60 38 72 54 66 C 68 60 80 66 94 60 C 86 68 70 76 52 70 C 34 65 22 74 6 68 Z" fill="#00B4D8"/>
    <path d="M 12 70 C 26 64 40 72 54 68 C 64 64 78 68 88 62 C 78 69 66 73 52 71 C 36 68 24 75 12 70 Z" fill="#0077B6" opacity="0.6"/>
  </g>
  <!-- Wordmark 'AQUENZA' -->
  <text x="160" y="162" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Inter', 'Segoe UI', system-ui, sans-serif" font-size="44" font-weight="800" letter-spacing="3.5" fill="#002B49">
