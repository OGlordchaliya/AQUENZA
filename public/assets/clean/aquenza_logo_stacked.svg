  </text>
  <!-- Aqua Wave Accent under 'UEN' -->
  <path d="M 115 170 C 145 166 175 174 205 168 C 185 173 155 173 115 170 Z" fill="#00B4D8"/>
  <!-- Tagline with Dashes -->
  <text x="160" y="200" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Inter', 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="4" fill="#64748B">
    — YOUR BRAND. OUR BOTTLE. —
  </text>
</svg>
