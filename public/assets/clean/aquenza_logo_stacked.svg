<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 260" width="320" height="260" fill="none">
  <!-- Central 'A' Emblem -->
  <g transform="translate(110, 15)">
    <path d="M 50 8 L 14 96 L 33 96 L 42 72 L 58 72 L 67 96 L 86 96 Z" fill="#003366"/>
    <polygon points="50,26 38,62 62,62" fill="#FFFFFF"/>
    <!-- Teardrop Water Droplet inside apex -->
    <path d="M 50 32 C 46 38 43 43 43 47 C 43 51 46.2 54 50 54 C 53.8 54 57 51 57 47 C 57 43 54 38 50 32 Z" fill="#00B4D8"/>
