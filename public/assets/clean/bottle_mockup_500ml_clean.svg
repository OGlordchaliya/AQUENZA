<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1200" width="600" height="1200" fill="none">
  <defs>
    <radialGradient id="bgGrad500" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="85%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </radialGradient>
    <linearGradient id="glassBody500" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.75)"/>
      <stop offset="12%" stop-color="rgba(235,248,255,0.25)"/>
      <stop offset="35%" stop-color="rgba(255,255,255,0.9)"/>
      <stop offset="65%" stop-color="rgba(240,249,255,0.2)"/>
      <stop offset="88%" stop-color="rgba(220,240,255,0.35)"/>
      <stop offset="100%" stop-color="rgba(200,225,245,0.75)"/>
    </linearGradient>
    <linearGradient id="capGrad500" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="20%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F8FAFC"/>
      <stop offset="90%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <filter id="shadow500" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="30" stdDeviation="24" flood-color="rgba(15, 23, 42, 0.12)"/>
    </filter>
  </defs>

  <rect width="600" height="1200" fill="url(#bgGrad500)"/>

  <!-- Ground Shadows -->
  <ellipse cx="300" cy="1080" rx="120" ry="18" fill="rgba(15, 23, 42, 0.08)"/>
  <ellipse cx="300" cy="1075" rx="80" ry="9" fill="rgba(15, 23, 42, 0.15)"/>

  <g filter="url(#shadow500)">
    <!-- Tall Slim Cylindrical Body matching 115085.jpg -->
    <rect x="215" y="270" width="170" height="790" rx="18" fill="url(#glassBody500)" stroke="rgba(180,210,235,0.8)" stroke-width="2.5"/>

    <!-- Water volume fill -->
    <rect x="218" y="295" width="164" height="755" rx="14" fill="rgba(240, 249, 255, 0.2)"/>

    <!-- Highlights -->
    <rect x="226" y="285" width="14" height="755" rx="7" fill="rgba(255,255,255,0.75)"/>
    <rect x="246" y="290" width="5" height="745" rx="2.5" fill="rgba(255,255,255,0.4)"/>
    <rect x="368" y="285" width="10" height="755" rx="5" fill="rgba(255,255,255,0.3)"/>

    <!-- Base Dimple & Rim -->
    <path d="M 276 1056 Q 300 1046 324 1056" stroke="rgba(148, 163, 184, 0.6)" stroke-width="3" fill="none"/>
    <ellipse cx="300" cy="1054" rx="18" ry="4" fill="rgba(148, 163, 184, 0.3)"/>

    <!-- Bottle Neck -->
    <rect x="230" y="240" width="140" height="34" rx="4" fill="url(#glassBody500)" stroke="rgba(180,210,235,0.8)" stroke-width="1.5"/>

    <!-- White Cap matching 115085.jpg -->
    <rect x="226" y="140" width="148" height="105" rx="10" fill="url(#capGrad500)" stroke="#CBD5E1" stroke-width="1.5"/>
    <ellipse cx="300" cy="144" rx="68" ry="5" fill="#FFFFFF" opacity="0.8"/>
    <line x1="226" y1="230" x2="374" y2="230" stroke="#94A3B8" stroke-width="1.5"/>

    <!-- ================= LABEL ARTWORK ================= -->
    <!-- AQUENZA Monogram 'A' -->
    <g transform="translate(268, 385)">
      <path d="M 32 4 L 8 68 L 22 68 L 28 50 L 37 50 L 43 68 L 57 68 Z" fill="#003B73"/>
      <polygon points="32,17 23,43 41,43" fill="#FFFFFF"/>
      <path d="M 32 20 C 29 25 26 29 26 33 C 26 37 28.5 40 32 40 C 35.5 40 38 37 38 33 C 38 29 35 25 32 20 Z" fill="#00B4D8"/>
      <path d="M 3 47 C 14 41 24 50 35 46 C 45 41 54 46 63 42 C 58 48 46 54 34 50 C 22 46 14 52 3 47 Z" fill="#00B4D8"/>
      <path d="M 7 49 C 17 44 27 51 35 48 C 41 46 49 48 58 45 C 50 50 43 53 34 51 C 22 49 15 54 7 49 Z" fill="#0077B6" opacity="0.7"/>
    </g>

    <text x="300" y="490" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif" font-size="29" font-weight="800" letter-spacing="2.5" fill="#002B49">
      AQUENZA
    </text>

    <text x="300" y="510" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif" font-size="8" font-weight="700" letter-spacing="2.2" fill="#475569">
      — YOUR BRAND. OUR BOTTLE. —
    </text>

    <!-- Droplet & Standard Category -->
    <path d="M 300 585 C 297 590 295 593 295 596 C 295 599 297.2 601 300 601 C 302.8 601 305 599 305 596 C 305 593 303 590 300 585 Z" fill="#00B4D8"/>
    <text x="300" y="622" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="3" fill="#003366">
      DRINKING WATER
    </text>

    <!-- Lower Flowing Ocean Waves -->
    <g transform="translate(216, 770)">
      <path d="M 0 50 C 35 68 70 38 105 62 C 140 86 160 58 168 70 L 168 115 L 0 115 Z" fill="#003B73"/>
      <path d="M 0 32 C 40 14 75 55 115 28 C 145 6 158 35 168 22 L 168 58 C 148 45 125 72 95 50 C 65 28 35 52 0 35 Z" fill="#00B4D8"/>
      <path d="M 0 30 C 38 13 72 53 112 26 C 142 5 156 33 168 20" stroke="rgba(255,255,255,0.75)" stroke-width="2" fill="none"/>
    </g>

    <!-- Volume -->
    <text x="300" y="930" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="600" letter-spacing="3" fill="#475569">
      — 500 ml —
    </text>
  </g>

  <!-- Clean Format Badge -->
  <g transform="translate(50, 60)">
    <rect width="130" height="34" rx="17" fill="#0052CC"/>
    <text x="65" y="22" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" letter-spacing="1">
      500 ml STANDARD
    </text>
  </g>
</svg>