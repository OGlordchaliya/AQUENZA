<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 1350" width="650" height="1350" fill="none">
  <defs>
    <radialGradient id="bgGrad1L" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="85%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </radialGradient>
    <linearGradient id="glassBody1L" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.85)"/>
      <stop offset="12%" stop-color="rgba(235,248,255,0.3)"/>
      <stop offset="35%" stop-color="rgba(255,255,255,0.95)"/>
      <stop offset="65%" stop-color="rgba(240,249,255,0.25)"/>
      <stop offset="88%" stop-color="rgba(220,240,255,0.4)"/>
      <stop offset="100%" stop-color="rgba(195,225,245,0.85)"/>
    </linearGradient>
    <linearGradient id="capGrad1L" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="25%" stop-color="#334155"/>
      <stop offset="70%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <filter id="shadow1L" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="35" stdDeviation="28" flood-color="rgba(15, 23, 42, 0.15)"/>
    </filter>
  </defs>

  <rect width="650" height="1350" fill="url(#bgGrad1L)"/>

  <!-- Ground Shadows -->
  <ellipse cx="325" cy="1225" rx="145" ry="22" fill="rgba(15, 23, 42, 0.1)"/>
  <ellipse cx="325" cy="1220" rx="95" ry="11" fill="rgba(15, 23, 42, 0.18)"/>

  <g filter="url(#shadow1L)">
    <!-- Substantial 1 Litre Premium Cylinder -->
    <rect x="220" y="280" width="210" height="930" rx="24" fill="url(#glassBody1L)" stroke="rgba(175,205,235,0.85)" stroke-width="3"/>

    <!-- Water volume fill -->
    <rect x="224" y="310" width="202" height="885" rx="18" fill="rgba(240, 249, 255, 0.22)"/>

    <!-- Highlights -->
    <rect x="234" y="295" width="16" height="895" rx="8" fill="rgba(255,255,255,0.8)"/>
    <rect x="258" y="300" width="6" height="885" rx="3" fill="rgba(255,255,255,0.45)"/>
    <rect x="408" y="295" width="12" height="895" rx="6" fill="rgba(255,255,255,0.35)"/>

    <!-- Base Dimple & Rim -->
    <path d="M 290 1202 Q 325 1190 360 1202" stroke="rgba(148, 163, 184, 0.6)" stroke-width="3.5" fill="none"/>
    <ellipse cx="325" cy="1198" rx="22" ry="5" fill="rgba(148, 163, 184, 0.3)"/>

    <!-- Bottle Neck -->
    <rect x="245" y="240" width="160" height="42" rx="6" fill="url(#glassBody1L)" stroke="rgba(175,205,235,0.85)" stroke-width="2"/>

    <!-- Premium Luxury Midnight Cap -->
    <rect x="240" y="130" width="170" height="114" rx="12" fill="url(#capGrad1L)" stroke="#475569" stroke-width="1.5"/>
    <ellipse cx="325" cy="135" rx="78" ry="6" fill="#64748B" opacity="0.6"/>
    <!-- Gold Trim Ring on Cap -->
    <line x1="240" y1="230" x2="410" y2="230" stroke="url(#goldAccent)" stroke-width="3.5"/>

    <!-- ================= CUSTOM VENUE CO-BRANDED LABEL ================= -->
    <g transform="translate(230, 390)">
      <!-- Label Background Container -->
      <rect x="0" y="0" width="190" height="660" rx="12" fill="rgba(255,255,255,0.85)" stroke="rgba(226, 232, 240, 0.8)" stroke-width="1.5"/>

      <!-- Gold Top Trim -->
      <line x1="15" y1="18" x2="175" y2="18" stroke="url(#goldAccent)" stroke-width="2"/>

      <!-- Fictional Sample Client Venue Branding (Clearly Marked Demo) -->
      <rect x="55" y="32" width="80" height="28" rx="6" fill="#0F172A"/>
      <text x="95" y="51" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" letter-spacing="1" fill="#F59E0B">
        ROYAL BISTRO
      </text>

      <text x="95" y="76" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="700" letter-spacing="2" fill="#64748B">
        FINE DINING &amp; BANQUETS
      </text>

      <!-- Customer QR Code Zone -->
      <g transform="translate(57, 92)">
        <!-- Realistic QR Graphic -->
        <rect width="76" height="76" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" rx="6"/>
        <!-- QR Corner Markers -->
        <rect x="6" y="6" width="20" height="20" fill="#0F172A"/>
        <rect x="9" y="9" width="14" height="14" fill="#FFFFFF"/>
        <rect x="12" y="12" width="8" height="8" fill="#0F172A"/>

        <rect x="50" y="6" width="20" height="20" fill="#0F172A"/>
        <rect x="53" y="9" width="14" height="14" fill="#FFFFFF"/>
        <rect x="56" y="12" width="8" height="8" fill="#0F172A"/>

        <rect x="6" y="50" width="20" height="20" fill="#0F172A"/>
        <rect x="9" y="53" width="14" height="14" fill="#FFFFFF"/>
        <rect x="12" y="56" width="8" height="8" fill="#0F172A"/>

        <!-- QR Inner Matrix Pixels -->
        <rect x="30" y="8" width="6" height="6" fill="#0F172A"/>
        <rect x="40" y="14" width="6" height="6" fill="#0F172A"/>
        <rect x="32" y="24" width="12" height="6" fill="#0F172A"/>
        <rect x="8" y="32" width="6" height="12" fill="#0F172A"/>
        <rect x="18" y="38" width="8" height="6" fill="#0F172A"/>
        <rect x="32" y="36" width="12" height="12" fill="#00B4D8"/>
        <rect x="50" y="32" width="8" height="6" fill="#0F172A"/>
        <rect x="62" y="38" width="6" height="10" fill="#0F172A"/>
        <rect x="30" y="54" width="8" height="6" fill="#0F172A"/>
        <rect x="44" y="50" width="8" height="12" fill="#0F172A"/>
        <rect x="56" y="56" width="12" height="6" fill="#0F172A"/>
      </g>

      <text x="95" y="184" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="700" letter-spacing="1" fill="#0284C7">
        SCAN FOR MENU &amp; REVIEWS
      </text>

      <!-- Divider -->
      <line x1="25" y1="202" x2="165" y2="202" stroke="#E2E8F0" stroke-width="1.5"/>

      <!-- Authorized "PREMIUM" Designation Solely for 1L -->
      <text x="95" y="228" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" letter-spacing="3.5" fill="#D97706">
        PREMIUM
      </text>
      <text x="95" y="246" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" letter-spacing="2.5" fill="#002B49">
        DRINKING WATER
      </text>

      <!-- Co-Branded AQUENZA Quality Assurance Mark -->
      <g transform="translate(48, 275)">
        <path d="M 18 3 L 4 36 L 12 36 L 15 27 L 21 27 L 24 36 L 32 36 Z" fill="#003B73"/>
        <polygon points="18,10 13,23 23,23" fill="#FFFFFF"/>
        <path d="M 18 12 C 16 15 14 17 14 19 C 14 21 15.5 23 18 23 C 20.5 23 22 21 22 19 C 22 17 20 15 18 12 Z" fill="#00B4D8"/>
        <path d="M 2 26 C 8 22 14 27 20 25 C 26 22 30 25 36 23 C 32 27 26 30 19 28 C 12 26 8 29 2 26 Z" fill="#00B4D8"/>
        <!-- Text beside -->
        <text x="42" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="800" letter-spacing="1.5" fill="#002B49">
          AQUENZA
        </text>
        <text x="42" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="6" font-weight="700" letter-spacing="1.5" fill="#64748B">
          QUALITY COORDINATION
        </text>
      </g>

      <!-- Signature Ocean Waves -->
      <g transform="translate(0, 480)">
        <path d="M 0 45 C 35 60 70 35 105 58 C 145 80 170 50 190 65 L 190 120 L 0 120 Z" fill="#003B73"/>
        <path d="M 0 30 C 40 12 80 50 120 25 C 155 4 175 30 190 18 L 190 52 C 170 40 145 68 115 48 C 80 25 45 46 0 30 Z" fill="#00B4D8"/>
        <path d="M 0 28 C 38 11 78 48 118 23 C 152 3 172 28 190 16" stroke="rgba(255,255,255,0.75)" stroke-width="2" fill="none"/>
      </g>

      <!-- Volume -->
      <text x="95" y="630" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700" letter-spacing="3" fill="#0F172A">
        — 1 LITRE —
      </text>

      <line x1="15" y1="645" x2="175" y2="645" stroke="url(#goldAccent)" stroke-width="2"/>
    </g>
  </g>

  <!-- Luxury Badge -->
  <g transform="translate(50, 60)">
    <rect width="180" height="34" rx="17" fill="#0F172A" stroke="url(#goldAccent)" stroke-width="1.5"/>
    <text x="90" y="22" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#F59E0B" letter-spacing="1.2">
      1 LITRE PREMIUM
    </text>
  </g>
</svg>